services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: notif_platform
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  mysql_data:
